<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRAZEN Employee Portal</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101d34;
      font-family: Arial, sans-serif;
      color: #17243b;
    }
    .portal {
      background: white;
      width: 90%;
      max-width: 400px;
      padding: 40px 28px;
      border-radius: 14px;
      text-align: center;
    }
    h1 { color: #c99b3b; letter-spacing: 4px; }
    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border-radius: 7px;
      font-size: 16px;
    }
    input { border: 1px solid #ddd; }
    button {
      border: 0;
      background: #c99b3b;
      font-weight: bold;
      cursor: pointer;
    }
    a { color: #c99b3b; }
    #error { color: red; }
  </style>
</head>
<body>
  <div class="portal">
    <h1>BRAZEN</h1>
    <p>PROPERTY & HOME SERVICES</p>
    <h2>Employee Portal</h2>
    <p>Enter your employee access code to continue.</p>

    <form id="login">
      <input id="code" type="password"
        placeholder="Employee Access Code" required>
      <button type="submit">Enter Portal</button>
    </form>

    <p id="error"></p>

    <div id="access" hidden>
      <h3>Access Granted</h3>
      <a id="documentLink" href="#" target="_blank">
        Open Employee Document
      </a>
    </div>

    <p><a href="index.html">← Back to Main Website</a></p>
  </div>

  <script>
    const EMPLOYEE_CODE = "Legalduty13@";
    const GOOGLE_FILE_URL = "https://docs.google.com/document/d/1yo3G00gLraSX9-MfJzAthItXEGZn1vC_jgc86OCqhHE/edit?tab=t.0";

    document.getElementById("login").addEventListener("submit", function(e) {
      e.preventDefault();

      if (document.getElementById("code").value === EMPLOYEE_CODE) {
        document.getElementById("login").hidden = true;
        document.getElementById("error").textContent = "";
        document.getElementById("access").hidden = false;
        document.getElementById("documentLink").href = GOOGLE_FILE_URL;
      } else {
        document.getElementById("error").textContent =
          "Incorrect access code. Please try again.";
      }
    });
  </script>
</body>
</html>
